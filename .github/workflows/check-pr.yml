name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per PR / per branch.
  #   - Pushing to a PR cancels the now-obsolete run.
  #   - Runs on main are never cancelled, so every merged commit gets a CI verdict.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # `!cancelled()` on each check so that one failure doesn't hide the others

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.10-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev-tools,test

      - name: Ruff
        if: ${{ !cancelled() }}
        run: poetry run ruff check .

      - name: Black
        if: ${{ !cancelled() }}
        run: poetry run black --check .

      - name: Type checking
        if: ${{ !cancelled() }}
        run: poetry run pyrefly check --output-format=github

      - name: Tests
        if: ${{ !cancelled() }}
        run: poetry run pytest tests/
