name: Release

on:
  workflow_dispatch:

# Read-only GHA token by default
permissions:
  contents: read

concurrency:
  # Never run two releases at once, and never cancel one mid-publish.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' pyproject.toml)
          test -n "$VERSION" || { echo "::error::Could not parse version from pyproject.toml"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check version is unreleased
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/hokum/${{ steps.version.outputs.version }}/json")
          case "$STATUS" in
            404) echo "Version ${{ steps.version.outputs.version }} is unreleased - proceeding" ;;
            200) echo "::error::hokum ${{ steps.version.outputs.version }} already exists on PyPI"; exit 1 ;;
            *)   echo "::error::Unexpected PyPI response ${STATUS}"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build
        run: poetry build --no-interaction

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job for PyPI publishing, with elevated github permissions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hokum/
    permissions:
      id-token: write  # mint the OIDC token used for PyPI trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    # Separate job for git tagging, with elevated github permissions
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag release
        run: |
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"
