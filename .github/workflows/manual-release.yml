name: Release

on:
  workflow_run:
    workflows: ["Code Checks"]
    types: [completed]
    branches: [main]

# Read-only GHA token by default
permissions:
  contents: read

concurrency:
  # Never run two releases at once, and never cancel one mid-publish.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # A release happens iff this commit's version isn't on PyPI yet.
  # Skipping (rather than failing) keeps routine merges green.

  should-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_releaseable: ${{ steps.check.outputs.is_releaseable }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+)".*/\1/p' pyproject.toml)
          test -n "$VERSION" || { echo "::error::Could not parse version from pyproject.toml"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether version is on PyPI
        id: check
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/hokum/${{ steps.version.outputs.version }}/json")
          case "$STATUS" in
            404) echo "is_releaseable=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "is_releaseable=false" >> "$GITHUB_OUTPUT"
                 echo "::notice title=No release::hokum ${{ steps.version.outputs.version }} is already on PyPI" ;;
            *)   echo "::error::Unexpected PyPI response ${STATUS}"; exit 1 ;;
          esac

  build:
    needs: should-release
    if: needs.should-release.outputs.is_releaseable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10" # managed by min-python-version.toml

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build
        run: poetry build --no-interaction

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job for PyPI publishing, with elevated github permissions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hokum/
    permissions:
      id-token: write  # mint the OIDC token used for PyPI trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    # Separate job for git tagging, with elevated github permissions
    needs: [should-release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag release
        run: |
          git tag "v${{ needs.should-release.outputs.version }}"
          git push origin "v${{ needs.should-release.outputs.version }}"

  smoke-test:
    # Install the released package and check that it actually runs
    needs: [should-release, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10" # managed by min-python-version.toml

      - name: Install from PyPI
        run: |
          VERSION="${{ needs.should-release.outputs.version }}"
          # The index can lag the upload by a little, so retry.
          for attempt in $(seq 1 5); do
            if pip install "hokum==${VERSION}"; then
              exit 0
            fi
            echo "hokum ${VERSION} not installable yet (attempt ${attempt}/5)"
            sleep 30
          done
          echo "::error::hokum ${VERSION} never became installable on PyPI"
          exit 1

      - name: Run Tool
        run: |
          VERSION="${{ needs.should-release.outputs.version }}"
          OUTPUT=$(hokum --version)
          echo "hokum --version -> ${OUTPUT}"
          if [[ "$OUTPUT" != *"$VERSION"* ]]; then
            echo "::error::Expected version ${VERSION} in output"
            exit 1
          fi
          echo "::notice title=Released::hokum ${VERSION} published to PyPI and verified"

  report:
    # Single consolidated summary for the whole run, whichever path it took
    needs: [should-release, smoke-test, tag]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write release report
        run: |
          VERSION="${{ needs.should-release.outputs.version }}"
          if [[ "${{ needs.should-release.result }}" != "success" ]]; then
            echo "⚠️ No release - code checks failed or the version could not be determined" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ needs.should-release.outputs.is_releaseable }}" != "true" ]]; then
            echo "🤷 No release - hokum ${VERSION} is already on PyPI" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ needs.smoke-test.result }}" == "success" && "${{ needs.tag.result }}" == "success" ]]; then
            echo "🎉 Released [hokum ${VERSION}](https://pypi.org/project/hokum/${VERSION}/) to PyPI and tagged v${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "💥 Release of hokum ${VERSION} did not complete cleanly (smoke-test: ${{ needs.smoke-test.result }}, tag: ${{ needs.tag.result }})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
