name: Code Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per PR / per branch.
  #   - Pushing to a PR cancels the now-obsolete run.
  #   - Runs on main are never cancelled, so every merged commit gets a CI verdict.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style-checks:
    runs-on: ubuntu-latest
    steps:
      # `!cancelled()` on each check so that one failure doesn't hide the others

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-poetry

      - name: Ruff
        if: ${{ !cancelled() }}
        run: poetry run ruff check .

      - name: Black
        if: ${{ !cancelled() }}
        run: poetry run black --check .

      - name: Type checking
        if: ${{ !cancelled() }}
        run: poetry run pyrefly check --output-format=github

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-poetry

      - name: Tests
        if: ${{ !cancelled() }}
        run: poetry run pytest tests/
