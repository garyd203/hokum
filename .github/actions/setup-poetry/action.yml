name: Set up Poetry environment
description: Python + Poetry + cached venv + installed dependencies

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py3.10-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction --with dev-tools,test
