name: Set up Poetry environment
description: Python + Poetry + cached venv + installed dependencies

inputs:
  python-version:
    description: Python version to install
    default: "3.10" # managed by min-python-version.toml

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction --with dev-tools,test
