[tool.black]
line-length = 88
skip-magic-trailing-comma = true

[project]
name = "hokum"
version = "0.3.0" # managed by bump-my-version
description = "Wrap any CLI command as a Claude Code hook - with correct exit codes, stderr, and JSON"
authors = [
    { name="garyd", email="github@gazza.id.au" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10" # managed by min-python-version.toml
keywords = ["claude-code", "hooks", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=4.22,<5",
]

[project.urls]
"Repository" = "https://github.com/garyd203/hokum"
"Changelog" = "https://github.com/garyd203/hokum/blob/main/CHANGELOG.md"
"Issues" = "https://github.com/garyd203/hokum/issues"

[project.scripts]
hokum = "hokum.main:app"

[tool.poetry]
packages = [
    { include="hokum", from="src" },
]

[tool.poetry.group.dev-tools.dependencies]
black = "=26.5.1"
pyrefly = "~1"
ruff = "~0.15"
bump-my-version = "~1.5"

[tool.poetry.group.test.dependencies]
pytest = "~9"

[tool.bumpversion]
current_version = "0.3.0"

[[tool.bumpversion.files]]
# The source of truth for the version.
filename = "src/hokum/__about__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
# Anchored to line start so this can't match `current_version` above.
regex = true
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.pyrefly]
# Strict everywhere by default.
preset = "strict"
project-includes = [
    "src/**/*.py*",
    "tests/**/*.py*",
]

python-version = "3.10" # managed by min-python-version.toml

[tool.pyrefly.errors]
# We don't enforce typing, so implicit Any's are acceptable.
implicit-any-parameter = "ignore"

[[tool.pyrefly.sub-config]]
# Test code has a relaxed expectation for type checking - most of the time
# it adds noise and hassle without improving quality or readability.
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
missing-override-decorator = "ignore"

[tool.ruff.lint]
extend-select = [
    # 'isort' import sorter
    "I",
]

[tool.ruff.lint.isort]
# One imported name per line, for cleaner change tracking
force-single-line = true
# Match black's config where we enable skip-magic-trailing-comma
split-on-trailing-comma = false


[build-system]
requires = ["poetry-core>=2.4.0"]
build-backend = "poetry.core.masonry.api"
